<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uni Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f2f7;--card:#ffffff;--ink:#000000;--mute:#8a8a8e;--line:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);
  --mat:rgba(249,249,251,.78);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--teal:#32ade6;--yellow:#ffcc00;--pink:#ff2d55;
  --common:#8e8e93;--rare:#0a84ff;--epic:#bf5af2;--legendary:#ff9f0a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#1c1c1e;--ink:#ffffff;--mute:#8e8e93;--line:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);
    --mat:rgba(28,28,30,.78);
    --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#64d2ff;--yellow:#ffd60a;--pink:#ff375f;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--ink:#ffffff;--mute:#8e8e93;--line:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);
  --mat:rgba(28,28,30,.78);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#64d2ff;--yellow:#ffd60a;--pink:#ff375f;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;-webkit-appearance:none}
.ic{display:block;flex:none}
#wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:0 -16px;padding:8px 16px 9px;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--line)}
.tr{display:flex;align-items:center;gap:10px}
.lvb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(145deg,#5e5ce6,#0a84ff);flex:none}
.tt{flex:1;min-width:0;line-height:1.15}
.tt b{display:block;font-size:14px;font-weight:700}
.tt span{font-size:11.5px;color:var(--mute);font-weight:500}
.chip{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:99px;padding:5px 10px 5px 8px;font-weight:700;font-size:13px}
.chip.f{color:var(--orange)}.chip.x{color:var(--yellow)}
.chip .ic{width:15px;height:15px}
.xpl{height:3px;border-radius:3px;background:var(--fill);margin-top:8px;overflow:hidden}
.xpl i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .6s cubic-bezier(.2,.8,.2,1)}
/* title */
.ttl{display:flex;align-items:flex-end;justify-content:space-between;margin:16px 2px 12px}
.ttl h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.6px;font-weight:800}
.ttl small{display:block;color:var(--mute);font-size:13px;font-weight:500;margin-bottom:3px}
.addb{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);display:grid;place-items:center}
.addb:active{transform:scale(.92)}
.links{display:flex;gap:16px;margin:-4px 4px 4px;font-size:14px;color:var(--blue);font-weight:500}
/* groups */
.sec{margin:18px 0 0}
.sh{display:flex;align-items:center;width:100%;padding:0 6px 7px;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.2px;text-transform:uppercase}
.sh .cnt{margin-left:7px;font-weight:500;text-transform:none;letter-spacing:0}
.sh .ic{margin-left:auto;width:15px;height:15px;transition:transform .25s}
.sh.open .ic{transform:rotate(90deg)}
.list,.grp{background:var(--card);border-radius:14px;overflow:hidden}
.ri{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;cursor:pointer;transition:background .15s}
.ri+.ri::before,.grp>.gr+.gr::before{content:"";position:absolute;left:54px;right:0;top:0;height:.5px;background:var(--line)}
.ri:active,.gr.tap:active{background:var(--fill)}
.rc{--c:var(--blue);width:26px;height:26px;border-radius:50%;border:2px solid var(--c);flex:none;display:grid;place-items:center;color:#fff;padding:0;transition:background .2s,transform .2s}
.rc:active{transform:scale(.88)}
.rc:disabled{border-style:dotted;opacity:.6;cursor:default}
.rc .ic{width:15px;height:15px;stroke-width:3}
.rc.d-easy{--c:var(--green)}.rc.d-med{--c:var(--blue)}.rc.d-hard{--c:var(--purple)}.rc.d-epic{--c:var(--orange)}
.done .rc{background:var(--c)}
.rb{flex:1;min-width:0}
.rt{font-size:16px;font-weight:500;word-break:break-word;line-height:1.25}
.done .rt{color:var(--mute);text-decoration:line-through}
.rs{font-size:12.5px;color:var(--mute);margin-top:2px}
.rs b{color:var(--red);font-weight:600}
.pbar{height:4px;border-radius:4px;background:var(--fill);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .5s}
.tg{width:30px;height:30px;display:grid;place-items:center;color:var(--mute);border-radius:8px;flex:none}
.tg .ic{width:17px;height:17px;transition:transform .25s}
.tg.open .ic{transform:rotate(90deg)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03);background:color-mix(in srgb,var(--yellow) 30%,var(--card))}100%{transform:scale(1)}}
.pop{animation:pop .5s}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.pop .rc .ic path{stroke-dasharray:24;animation:draw .35s ease-out}
.empty{padding:20px 16px;text-align:center;color:var(--mute);font-size:14px}
.empty .btn{margin-top:12px}
.btn{background:var(--blue);color:#fff;font-weight:600;font-size:15px;border-radius:12px;padding:11px 18px}
.btn.alt{background:var(--fill);color:var(--blue)}
.btn:active{opacity:.7}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* rings */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border-radius:18px;padding:16px 8px 14px}
.rg{text-align:center}
.rg svg{width:100%;max-width:74px;height:auto}
.rg .n{font-size:12.5px;font-weight:700;margin-top:4px}
.rg .m{font-size:11px;color:var(--mute);margin-top:1px;line-height:1.3}
.rg .p{font-size:11px;font-weight:600;margin-top:2px}
.up{color:var(--green)}.dn{color:var(--red)}
.note{font-size:12px;color:var(--mute);text-align:center;margin:8px 8px 0}
/* quote */
.quote{margin-top:14px;border-radius:18px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#5e5ce6,#bf5af2 60%,#ff6482);position:relative;cursor:pointer}
.quote:active{transform:scale(.99)}
.quote .ic{position:absolute;right:14px;top:14px;opacity:.55;width:20px;height:20px}
.quote p{margin:0 28px 8px 0;font-size:16.5px;font-weight:600;line-height:1.35;letter-spacing:-.2px}
.quote span{font-size:12.5px;opacity:.85;font-weight:500}
/* tiles */
.tile{--a:#8e8e93;--b:#636366;width:var(--s);height:var(--s);border-radius:28%;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.18);flex:none}
.t-common{--a:#aeaeb2;--b:#636366}.t-rare{--a:#64d2ff;--b:#0a6cff}.t-epic{--a:#e0a0ff;--b:#8e3dd6}.t-legendary{--a:#ffe066;--b:#ff8a00}
.t-blue{--a:#64d2ff;--b:#0a6cff}.t-green{--a:#7be495;--b:#1faa48}.t-orange{--a:#ffc361;--b:#ff7a00}.t-red{--a:#ff8a80;--b:#e0301e}.t-purple{--a:#d6a0ff;--b:#7d3cf0}.t-teal{--a:#8be9f5;--b:#1996b8}.t-yellow{--a:#ffe680;--b:#f0a800}.t-pink{--a:#ff9db5;--b:#e0245e}
.tg3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{background:var(--card);border-radius:16px;padding:14px 6px 11px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px}
.tc b{font-size:12px;font-weight:600;line-height:1.2}
.tc small{font-size:10.5px;color:var(--mute);line-height:1.25;padding:0 4px}
.tc.off .tile{filter:grayscale(1);opacity:.35}
.tc.off b,.tc.off small{opacity:.55}
.tc.r-rare{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rare) 55%,transparent)}
.tc.r-epic{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--epic) 60%,transparent)}
.tc.r-legendary{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--legendary) 70%,transparent)}
.rar{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.rar.common{color:var(--common)}.rar.rare{color:var(--rare)}.rar.epic{color:var(--epic)}.rar.legendary{color:var(--legendary)}
/* segmented */
.seg2{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg2 button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);transition:background .2s}
.seg2 button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
:root[data-theme="dark"] .seg2 button.on{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg2 button.on{background:#636366}}
.seg2 small{display:block;font-size:10px;color:var(--mute);font-weight:500}
/* stats */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sc{background:var(--card);border-radius:16px;padding:12px 14px}
.sc b{display:block;font-size:22px;font-weight:800;letter-spacing:-.4px}
.sc span{font-size:12px;color:var(--mute)}
.card{background:var(--card);border-radius:16px;padding:14px}
.chart{width:100%;height:auto;display:block}
.chart .bb{fill:var(--blue);opacity:.55}.chart .bt{fill:var(--orange)}
.chart text{fill:var(--mute);font-size:9px;text-anchor:middle;font-family:inherit}
.chart .bv{font-size:8px;fill:var(--ink)}
.chart line{stroke:var(--line);stroke-width:.5}
.gr{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;font-size:16px}
.gr.tap{cursor:pointer}
.gr .l{flex:1}
.gr .v{color:var(--mute);font-size:15px}
.gr.red{color:var(--red);justify-content:center;font-weight:500}
.gr.blue{color:var(--blue);justify-content:center;font-weight:500}
.grp>.gr+.gr::before{left:14px}
.hint{font-size:12.5px;color:var(--mute);margin:7px 8px 0;line-height:1.4}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:640px;margin:0 auto;display:flex;padding-top:6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 5px;font-size:10.5px;font-weight:600;color:var(--mute)}
nav button .ic{width:26px;height:26px}
nav button.on{color:var(--blue)}
nav button:active{opacity:.6}
/* sheets */
#modal .bk{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .25s}
#modal .bk.mid{align-items:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet{background:var(--bg);width:100%;max-width:600px;border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.9,.25,1)}
.grab{width:36px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 4px}
.sn{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px;position:sticky;top:0;background:var(--bg);z-index:2}
.sn b{font-size:17px;font-weight:700}
.sn button{font-size:17px;color:var(--blue);min-width:60px}
.sn button.bold{font-weight:700;text-align:right}
.sn button:first-child{text-align:left}
.sn button:disabled{opacity:.4}
.fl{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;margin:16px 8px 6px;letter-spacing:.2px}
input[type=text],input[type=date],select,textarea{width:100%;background:transparent;color:var(--ink);border:none;outline:none;font-size:17px;font-family:inherit;padding:0}
.gr input[type=text]{padding:2px 0}
textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:12px 14px}
select{-webkit-appearance:none;appearance:none;text-align:right;color:var(--blue);font-size:16px}
.err{color:var(--red);font-size:13px;margin:8px 8px 0}
.alert{background:var(--card);border-radius:16px;width:min(300px,86vw);overflow:hidden;text-align:center;animation:fade .2s}
.alert .ab{padding:20px 18px 16px}
.alert h2{margin:0 0 6px;font-size:17px;font-weight:700}
.alert p{margin:0;font-size:13px;color:var(--mute);line-height:1.4}
.alert .acts{display:flex;border-top:.5px solid var(--line)}
.alert .acts button{flex:1;padding:13px 0;font-size:17px;color:var(--blue)}
.alert .acts button+button{border-left:.5px solid var(--line);font-weight:600}
.alert .acts button.red{color:var(--red)}
/* reveal */
.rev{background:var(--card);border-radius:26px;width:min(320px,90vw);padding:26px 20px 20px;text-align:center;animation:pp .55s cubic-bezier(.2,1.3,.3,1)}
@keyframes pp{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.rev .k{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--mute);text-transform:uppercase;margin-bottom:16px}
.rev .tile{margin:0 auto 14px}
.rev h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.3px}
.rev .q{font-size:13px;color:var(--mute);margin:12px 6px 16px;line-height:1.4;font-style:italic}
.rev .btn{width:100%}
.glow{box-shadow:0 0 0 6px color-mix(in srgb,var(--legendary) 20%,transparent),0 0 40px color-mix(in srgb,var(--legendary) 60%,transparent)!important}
.lvr{width:116px;height:116px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:46px;font-weight:800;color:#fff;background:conic-gradient(from 200deg,#0a84ff,#bf5af2,#ff375f,#ff9f0a,#0a84ff);box-shadow:0 8px 30px rgba(120,80,255,.45)}
.lvr span{display:grid;place-items:center;width:98px;height:98px;border-radius:50%;background:#1c1c1e}
/* fx */
.fxf{position:fixed;z-index:60;pointer-events:none;font-weight:800;font-size:17px;color:var(--yellow);text-shadow:0 1px 6px rgba(0,0,0,.45);animation:fl 1.1s ease-out forwards}
@keyframes fl{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-80px);opacity:0}}
.pt{position:fixed;z-index:59;pointer-events:none;width:8px;height:8px;border-radius:50%;animation:ptm .8s ease-out forwards}
@keyframes ptm{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--mat);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 8px 28px rgba(0,0,0,.25);padding:9px 16px 9px 10px;border-radius:99px;font-size:13.5px;font-weight:600;animation:tst 3.4s forwards;max-width:92vw}
@keyframes tst{0%{opacity:0;transform:translateY(-14px) scale(.95)}9%{opacity:1;transform:none}86%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="wrap"><div id="app"></div></div>
<nav><div class="in" id="nav"></div></nav>
<div id="modal"></div>
<div id="toasts"></div>
<script>

function pad(n){return String(n).padStart(2,"0")}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function today(){return dstr(new Date())}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function keyFor(p,ds){var d=ds?parse(ds):new Date();
  if(p==="day")return dstr(d);
  if(p==="week")return dstr(monday(d));
  if(p==="month")return d.getFullYear()+"-"+pad(d.getMonth()+1);
  return String(d.getFullYear())}
function curKey(p){return keyFor(p)}
function nid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function thr(L){return 50*L*(L-1)}

function norm(r){return Object.assign(blank(),JSON.parse(JSON.stringify(r)))}
function dayN(k){return S.days[k]&&S.days[k].n>0}
function streakInfo(){var n=0,d=new Date();if(!dayN(dstr(d)))d.setDate(d.getDate()-1);
  while(dayN(dstr(d))){n++;d.setDate(d.getDate()-1)}return n}
function mult(){return 1+Math.min(streakInfo(),10)*0.05}
function elapsed(p){var n=new Date();
  if(p==="day")return(n.getHours()*60+n.getMinutes())/1440;
  if(p==="week")return(((n.getDay()+6)%7)+n.getHours()/24)/7;
  if(p==="month"){var dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();return(n.getDate()-1+n.getHours()/24)/dim}

function gain(base,k){var x=Math.round(base*mult());S.xp+=x;var d=S.days[k]||(S.days[k]={xp:0,n:0});d.xp+=x;d.n++;return x}
function lose(x,k){S.xp=Math.max(0,S.xp-x);var d=S.days[k];if(d){d.xp=Math.max(0,d.xp-x);d.n=Math.max(0,d.n-1)}}
function drop(diff,force){
  var ch={easy:0.2,med:0.3,hard:0.45,epic:1}[diff];S.pity=(S.pity||0)+1;
  if(!(force||Math.random()<ch||S.pity>=5))return;
  S.pity=0;var r=Math.random()*100;
  var rar=r<2?"legendary":r<12?"epic":r<40?"rare":"common";
  if((diff==="epic"||force)&&rar==="common")rar="rare";
  var pool=CARDS.filter(function(c){return c.r===rar});
  var fresh=pool.filter(function(c){return !S.cards[c.id]});
  var arr=fresh.length?fresh:pool;var c=arr[Math.floor(Math.random()*arr.length)];
  S.cards[c.id]=(S.cards[c.id]||0)+1;fx.cards.push({c:c,dup:S.cards[c.id]>1,n:S.cards[c.id]})}

function undo(q){lose(q.aw,q.awDate);q.done=false;q.aw=0}
function settle(){for(var i=0;i<5;i++){var ch=false;
  S.quests.forEach(function(p){var k=kids(p.id);if(!k.length)return;
    var all=k.every(function(x){return x.done});
    if(all&&!p.done){finish(p,null,true);ch=true}
    else if(!all&&p.done){undo(p);ch=true}});
  if(!ch)break}}
function todayItems(){var t=today();
  var a=S.quests.filter(function(q){return q.period==="day"&&q.key===t}).map(function(q){return{done:q.done}});
  var r=S.rituals.map(function(x){return{done:!!(S.rit[t]&&S.rit[t][x.id]!==undefined)}});
  return a.concat(r)}
function tally(){
  var dq=S.quests.filter(function(q){return q.done});
  var ritN=0;Object.keys(S.rit).forEach(function(k){ritN+=Object.keys(S.rit[k]).length});
  function by(p){return dq.filter(function(q){return q.period===p}).length}
  var it=todayItems();var md=0;Object.keys(S.days).forEach(function(k){md=Math.max(md,S.days[k].xp)});
  return{total:dq.length+ritN,best:S.best,lvl:lvl(S.xp),wk:by("week"),mo:by("month"),yr:by("year"),
    hard:dq.filter(function(q){return q.diff==="hard"}).length,epic:dq.filter(function(q){return q.diff==="epic"}).length,
    maxDay:md,cards:Object.keys(S.cards).length,rit:ritN,
    perfect:it.length>=3&&it.every(function(i){return i.done})}}
function afterChange(before){
  var st=streakInfo();if(st>S.best)S.best=st;
  for(var i=0;i<5;i++){var t=tally(),got=false;
    ACH.forEach(function(a){if(!S.ach[a.id]&&a.f(t)){S.ach[a.id]=today();var k=today();
      S.xp+=25;(S.days[k]||(S.days[k]={xp:0,n:0})).xp+=25;fx.ach.push(a);got=true}});
    if(!got)break}
  var after=lvl(S.xp);if(after>before)fx.level=after;
  save();render();flush()}
function toggleQuest(id,pt){var q=findQ(id);if(!q||kids(q.id).length)return;
  var b=lvl(S.xp);if(q.done)undo(q);else finish(q,pt);settle();afterChange(b)}
function toggleRit(id,pt){var r=S.rituals.find(function(x){return x.id===id});if(!r)return;
  var t=today(),log=S.rit[t]||(S.rit[t]={}),b=lvl(S.xp);
  if(log[id]!==undefined){lose(log[id],t);delete log[id]}
  else{var x=gain(DIFF[r.diff].xp,t);log[id]=x;fx.xp.push({x:x,pt:pt});drop(r.diff)}
  afterChange(b)}

/* ---------- persistence ---------- */
function save(){S.ts=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}schedule()}
function schedule(){if(!docRef)return;clearTimeout(saveTimer);saveTimer=setTimeout(push,700)}
async function push(){if(writing){pending=true;return}writing=true;
  try{await docRef.set(JSON.parse(JSON.stringify(S)))}catch(e){console.warn(e)}
  writing=false;if(pending){pending=false;schedule()}}
function loadLocal(){try{var r=localStorage.getItem(LS)||localStorage.getItem("uniquest.v1");if(r)S=norm(JSON.parse(r))}catch(e){}}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    var user=await window.claude.use("user");var db=await window.claude.use("db");
    try{dlcap=await window.claude.use("downloads")}catch(e){}
    if(!db||!user)return;
    var id=await user.id();if(!id)return;
    docRef=db.doc("data/users/"+id+"/game");
    var snap=await docRef.get();
    if(snap.exists){var r=snap.data();if(!S.ts||r.ts>=S.ts){S=norm(r);applyTheme();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}else schedule()}
    else if(S.ts)schedule();
    ui.sync="cloud";render();
    docRef.onSnapshot(function(sn){if(!sn.exists)return;var r=sn.data();
      if(r.ts>S.ts){S=norm(r);applyTheme();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}},function(){});
  }catch(e){console.warn(e)}}

/* ---------- effects ---------- */
function floater(txt,pt){var el=document.createElement("div");el.className="fxf";el.textContent=txt;
  var x=pt?pt.x:innerWidth/2,y=pt?pt.y:innerHeight/3;el.style.left=x+"px";el.style.top=(y-20)+"px";
  document.body.appendChild(el);setTimeout(function(){el.remove()},1150);
  var cols=["#ff9f0a","#ffd60a","#0a84ff","#bf5af2","#30d158","#ff375f"];
  for(var i=0;i<12;i++){var p=document.createElement("div");p.className="pt";p.style.background=cols[i%cols.length];
    var a=Math.random()*6.28,r=34+Math.random()*60;p.style.left=x+"px";p.style.top=y+"px";
    p.style.setProperty("--dx",Math.cos(a)*r+"px");p.style.setProperty("--dy",Math.sin(a)*r+"px");
    document.body.appendChild(p);(function(n){setTimeout(function(){n.remove()},850)})(p)}
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}}
function toast(g,c,t){var el=document.createElement("div");el.className="toast";el.innerHTML=tile(g,"t-"+c,26)+'<span>'+esc(t)+'</span>';
  $("#toasts").appendChild(el);setTimeout(function(){el.remove()},3500)}
function flush(){var f=fx;fx={xp:[],cards:[],ach:[],level:null};
  f.xp.forEach(function(o){floater("+"+o.x+" XP",o.pt)});
  f.ach.forEach(function(a){toast(a.g,a.c,a.n+" unlocked · +25 XP")});
  if(f.level)ui.queue.push({type:"level",L:f.level,q:randQuote()});
  f.cards.forEach(function(c){ui.queue.push({type:"card",c:c.c,dup:c.dup,n:c.n})});
  if(ui.queue.length)render()}

function ring(p,col){var r=29,c=2*Math.PI*r,v=Math.max(0,Math.min(1,p));
  return'<svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="var(--fill)" stroke-width="8"/><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-v)).toFixed(1)+'" transform="rotate(-90 36 36)" style="transition:stroke-dashoffset .8s"/><text x="36" y="41" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)">'+Math.round(v*100)+'</text></svg>'}
function periodStats(p){var k=curKey(p);
  var qs=S.quests.filter(function(q){return q.period===p&&q.key===k});
  var done=qs.filter(function(q){return q.done}).length,tot=qs.length,sum=qs.reduce(function(a,q){return a+prog(q)},0);
  if(p==="day"){var t=today();S.rituals.forEach(function(r){tot++;if(S.rit[t]&&S.rit[t][r.id]!==undefined){done++;sum++}})}
  return{done:done,tot:tot,pct:tot?sum/tot:0,el:elapsed(p)}}
function rowQ(q,depth,showPar){var k=kids(q.id),p=Math.round(prog(q)*100),od=!q.done&&q.key<curKey(q.period),open=!!S.open[q.id];

  var h='<div class="ri'+(q.done?' done':'')+(ui.pop===q.id?' pop':'')+'" data-a="open" data-id="'+q.id+'" data-k="q" style="padding-left:'+(14+depth*22)+'px">'+

  if(m.type==="form")return formHTML();
  if(m.type==="detail")return detailHTML(m);
  if(m.type==="confirm")return'<div class="bk mid" data-a="close"><div class="alert"><div class="ab"><h2>'+m.title+'</h2><p>'+m.text+'</p></div><div class="acts"><button data-a="close" data-x="1">Cancel</button><button class="red" data-a="doit">'+(m.btn||"Delete")+'</button></div></div></div>';
  if(m.type==="import")return'<div class="bk" data-a="close"><div class="sheet"><div class="grab"></div><div class="sn"><button data-a="close" data-x="1">Cancel</button><b>Import</b><button class="bold" data-a="impgo">Import</button></div><div class="fl">Paste backup JSON · replaces current progress</div><div class="grp"><textarea data-f="text">'+esc(ui.form&&ui.form.text||"")+'</textarea></div>'+(ui.form&&ui.form.err?'<div class="err">'+ui.form.err+'</div>':'')+'</div></div>';
  return""}
function render(){var y=window.scrollY;$("#app").innerHTML=topbar()+"<main>"+tabHTML()+"</main>";$("#nav").innerHTML=navHTML();$("#modal").innerHTML=modalHTML();
  var ti=$("#modal #ftitle");if(ti&&ui.focus){ti.focus();ui.focus=false}}

/* ---------- actions ---------- */
function openAdd(){ui.modal={type:"form"};ui.form={type:"quest",title:"",period:ui.tab==="quests"?"week":"day",date:today(),diff:"med",parent:"",err:""};ui.focus=true;render()}
function submitAdd(){var f=ui.form,title=(f.title||"").trim();
  if(!title){f.err="Give it a name first.";render();return}
  var b=lvl(S.xp);
  if(f.type==="ritual")S.rituals.push({id:nid(),title:title,diff:f.diff});
  else{var par=f.parent?findQ(f.parent):null;
    S.quests.push({id:nid(),title:title,period:f.period,key:keyFor(f.period,f.period==="day"?(f.date||today()):null),diff:f.diff,parent:par?par.id:null,done:false,aw:0,awDate:""});
    if(par)S.open[par.id]=true;settle()}
  ui.modal=null;ui.form=null;afterChange(b)}
function delQuest(id){var q=findQ(id);if(!q)return;
  S.quests.forEach(function(k){if(k.parent===id)k.parent=q.parent||null});
  S.quests=S.quests.filter(function(x){return x.id!==id});var b=lvl(S.xp);settle();afterChange(b)}
function loadSample(){var b=lvl(S.xp),t=today();
  function add(title,period,diff,parent){var q={id:nid(),title:title,period:period,key:keyFor(period,period==="day"?t:null),diff:diff,parent:parent||null,done:false,aw:0,awDate:""};S.quests.push(q);return q.id}
  var y1=add("Pass every exam this year","year","epic");var m1=add("Finish the big assignment","month","hard",y1);
  var w1=add("Draft the first half","week","med",m1);add("Two focused hours on it","day","easy",w1);add("Outline the structure","day","easy",w1);
  var y2=add("Level up my English","year","epic");var m2=add("Complete 4 practice tests","month","hard",y2);add("Review mistakes from last test","week","med",m2);
  S.open[y1]=true;S.open[m1]=true;
  S.rituals.push({id:nid(),title:"Study English 30 min",diff:"easy"},{id:nid(),title:"Review today's lecture notes",diff:"easy"},{id:nid(),title:"Move your body 20 min",diff:"easy"});
  settle();afterChange(b)}
function doConfirm(){var m=ui.modal;ui.modal=null;ui.form=null;
  if(m.kind==="del"){delQuest(m.id);return}
  if(m.kind==="delr"){S.rituals=S.rituals.filter(function(r){return r.id!==m.id});afterChange(lvl(S.xp));return}
  if(m.kind==="reset"){var th=S.theme;S=blank();S.theme=th;ui.queue=[];afterChange(1)}}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t||t.disabled)return;
  var a=t.dataset.a,id=t.dataset.id,pt={x:e.clientX,y:e.clientY};
  if(a==="close"&&!t.dataset.x&&e.target!==t)return;
  function popClear(){setTimeout(function(){ui.pop=null},800)}
  switch(a){
    case"tab":ui.tab=t.dataset.tab;ui.pop=null;render();window.scrollTo(0,0);break;
    case"tq":e.stopPropagation();ui.pop=id;popClear();toggleQuest(id,pt);break;
    case"tr":e.stopPropagation();ui.pop=id;popClear();toggleRit(id,pt);break;
    case"tog":S.open[id]=!S.open[id];save();render();break;
    case"sec":S.sec[t.dataset.k]=!S.sec[t.dataset.k];save();render();break;
    case"expall":S.quests.forEach(function(q){if(kids(q.id).length)S.open[q.id]=true});save();render();break;
    case"colall":S.open={};save();render();break;
    case"quote":ui.qoff++;render();break;
    case"trtab":ui.tr=t.dataset.v;render();break;
    case"theme":S.theme=t.dataset.v;applyTheme();save();render();break;
    case"open":var o=t.dataset.k==="r"?S.rituals.find(function(x){return x.id===id}):findQ(id);if(o){ui.modal={type:"detail",kind:t.dataset.k,id:id};ui.form={rename:o.title};render()}break;
    case"dsave":var m=ui.modal,ob=m.kind==="r"?S.rituals.find(function(x){return x.id===m.id}):findQ(m.id),nt=(ui.form.rename||"").trim();if(ob&&nt)ob.title=nt;ui.modal=null;ui.form=null;save();render();break;
    case"askdel":var mm=ui.modal;ui.modal={type:"confirm",kind:mm.kind==="r"?"delr":"del",id:mm.id,title:mm.kind==="r"?"Delete ritual?":"Delete quest?",text:mm.kind==="r"?"It will no longer appear each day. XP already earned is kept.":"Quests inside it move up one level. XP already earned is kept."};render();break;
    case"add":openAdd();break;
    case"ftype":ui.form.type=t.dataset.v;render();break;
    case"fper":ui.form.period=t.dataset.v;ui.form.parent="";render();break;
    case"fdiff":ui.form.diff=t.dataset.v;render();break;
    case"save":submitAdd();break;
    case"close":ui.modal=null;ui.form=null;render();break;
    case"dismiss":ui.queue.shift();render();break;
    case"doit":doConfirm();break;
    case"roll":var q=findQ(id);if(q){q.key=curKey(q.period);ui.modal=null;ui.form=null;save();render()}break;
    case"sample":loadSample();break;
    case"exp":if(dlcap)dlcap.save({filename:"uni-quest-backup.json",data:JSON.stringify(S,null,2)}).then(function(){toast("check","green","Backup saved")}).catch(function(){});break;
    case"imp":ui.modal={type:"import"};ui.form={text:"",err:""};render();break;
    case"impgo":try{var r=JSON.parse(ui.form.text||"");if(!r||!Array.isArray(r.quests))throw 0;S=norm(r);applyTheme();ui.modal=null;ui.form=null;afterChange(lvl(S.xp))}catch(x){ui.form.err="That doesn't look like a valid backup.";render()}break;
    case"reset":ui.modal={type:"confirm",kind:"reset",title:"Reset everything?",text:"This erases all quests, XP, cards and achievements. It cannot be undone.",btn:"Reset"};render();break;
  }});
document.addEventListener("input",function(e){var f=e.target.dataset&&e.target.dataset.f;if(f&&ui.form)ui.form[f]=e.target.value});
document.addEventListener("change",function(e){var f=e.target.dataset&&e.target.dataset.f;if(f&&ui.form){ui.form[f]=e.target.value;if(f==="parent"||f==="date"){}}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="ftitle"){ui.form[ui.modal.type==="detail"?"rename":"title"]=e.target.value;if(ui.modal.type==="detail"){document.querySelector('[data-a="dsave"]').click()}else submitAdd()}});
window.addEventListener("online",schedule);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!ui.modal&&!ui.queue.length)render()});

loadLocal();applyTheme();render();initCloud();
})();
</script>
